server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: contact-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scm}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:scm-resilient-placeholder-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

rate:
  limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000}
