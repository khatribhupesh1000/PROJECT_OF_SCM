# ============================================================================
# Render Cloud Blueprint (render.yaml) - Smart Contact Manager (SCM)
# ============================================================================
services:
  - type: web
    name: smart-contact-manager
    runtime: node
    buildCommand: npm install && cd frontend-react && npm install && npm run build && cd ..
    startCommand: node api-gateway/src/server.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: auth-contact-api-gateway-khatribhupesh1000-2e27.f.aivencloud.com
      - key: DB_PORT
        value: 14049
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: MONGODB_URI
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
